<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <title>Velox Search</title>
  <style>
    body {
      margin: 0;
      background-color: #02349b;
      background-size: cover; /* Makes the image fill the screen */
      background-position: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
    }

    #bg-picker { margin-top: 20px; color: white; cursor: pointer; }

    form {
      background-color: white;
      width: 400px;
      height: 44px;
      border-radius: 32px;
      display: flex;
      align-items: center;
      margin-top: 50px;
    }

    input[type="search"] {
      all: unset;
      font: 16px system-ui;
      color: black;
      width: 100%;
      padding-left: 20px;
    }

    button { all: unset; cursor: pointer; padding-right: 15px; }
    svg { fill: #02349b; width: 20px; height: 20px; }

    #results { width: 80%; max-width: 600px; margin-top: 30px; color: white; }
    a { color: #87CEEB; }
  </style>
</head>
<body>

  <!-- New File Picker -->
  <input type="file" id="bg-picker" accept="image/*">

  <form role="search" id="form">
    <input type="search" id="query" placeholder="Search..." required>
    <button type="submit">
      <svg viewBox="0 0 1024 1024"><path d="M848.471 928l-263.059-263.059c-48.941 36.706-110.118 55.059-177.412 55.059-171.294 0-312-140.706-312-312s140.706-312 312-312c171.294 0 312 140.706 312 312 0 67.294-24.471 128.471-55.059 177.412l263.059 263.059-79.529 79.529zM189.623 408.078c0 121.364 97.091 218.455 218.455 218.455s218.455-97.091 218.455-218.455c0-121.364-103.159-218.455-218.455-218.455-121.364 0-218.455 97.091-218.455 218.455z"></path></svg>
    </button>
  </form>

  <div id="results"></div>

  <script>
    // Handle background upload
    document.getElementById('bg-picker').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          document.body.style.backgroundImage = `url('${event.target.result}')`;
        }
        reader.readAsDataURL(file);
      }
    });

    // Handle search
    const f = document.getElementById('form');
    const q = document.getElementById('query');
    const resultsDiv = document.getElementById('results');

    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      resultsDiv.innerHTML = "Searching...";
      const response = await fetch('https://google.serper.dev/search', {
        method: 'POST',
        headers: { 'X-API-KEY': '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', 'Content-Type': 'application/json' },
        body: JSON.stringify({ q: q.value })
      });
      const data = await response.json();
      resultsDiv.innerHTML = data.organic.map(item => `
        <div style="margin-bottom: 20px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 10px;">
          <a href="${item.link}" target="_blank" style="font-size: 1.2em;">${item.title}</a><br>
          <small>${item.snippet}</small>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
